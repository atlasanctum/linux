# Atlas Sanctum — WireGuard Node-to-Node Transport Template
# Each Atlas node gets a WireGuard interface for encrypted peer communication.
# Replace <PLACEHOLDERS> with actual values per deployment.
#
# Generate keys:  wg genkey | tee privatekey | wg pubkey > publickey
# Install:        apt install wireguard  /  dnf install wireguard-tools

[Interface]
# This node's WireGuard private key
PrivateKey = <THIS_NODE_PRIVATE_KEY>

# Atlas overlay network address for this node (e.g. 10.100.0.1/24)
Address = <THIS_NODE_OVERLAY_IP>/24

# WireGuard listen port
ListenPort = 51820

# Bring up/down routing on interface change
PostUp   = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# -----------------------------------------------------------------------
# Peer: Atlas Node B
# -----------------------------------------------------------------------
[Peer]
PublicKey  = <NODE_B_PUBLIC_KEY>
# Allowed overlay IPs for this peer
AllowedIPs = <NODE_B_OVERLAY_IP>/32
# Endpoint: public IP or DNS of peer node
Endpoint   = <NODE_B_PUBLIC_IP>:51820
# Keep-alive for NAT traversal (important for edge nodes behind routers)
PersistentKeepalive = 25

# -----------------------------------------------------------------------
# Peer: Atlas Regional Hub
# -----------------------------------------------------------------------
[Peer]
PublicKey  = <HUB_PUBLIC_KEY>
AllowedIPs = <HUB_OVERLAY_IP>/32
Endpoint   = <HUB_PUBLIC_IP>:51820
PersistentKeepalive = 25
