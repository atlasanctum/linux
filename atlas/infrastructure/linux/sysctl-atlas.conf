# Atlas Sanctum — Kernel tuning for Atlas nodes
# Place at /etc/sysctl.d/99-atlas.conf and run: sysctl --system

# Increase socket buffer sizes for high-throughput signal ingestion
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# Increase connection backlog for the Atlas API server
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Reduce TIME_WAIT for faster connection recycling on edge nodes
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# File descriptor limits for nodes handling many sensors
fs.file-max = 1048576

# Shared memory for inter-process coordination
kernel.shmmax = 2147483648
kernel.shmall = 524288

# Disable IPv6 if not needed on edge nodes (optional)
# net.ipv6.conf.all.disable_ipv6 = 1
